name: Deploy to Elastic Beanstalk

# Trigger: runs on every push to the main branch
on:
  push:
    branches:
      - main

env:
  AWS_REGION: ${{secrets.AWS_REGION}}
  S3_BUCKET:
  EB_APP_NAME:
  EB_ENV_NAME:


jobs:
  deploy:
    name: Build and Deploy
    runs-on: ubuntu-latest

    # Restrict token permissions - security best practice
    permissions:
      contents: read

    steps:

      # ── Step 1: Check out the source code ──────────────────────────────────
      - name: Checkout source code
        uses: actions/checkout@v4

      # ── Step 2: Set up Java 17 ─────────────────────────────────────────────
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'corretto'   # Amazon Corretto — same JDK used by EB
          cache: maven               # Cache Maven deps to speed up builds

      # ── Step 3: Build the JAR with Maven ──────────────────────────────────
      - name: Build with Maven
        run: mvn --batch-mode --no-transfer-progress package -DskipTests

      # ── Step 4: Generate a unique version label from the commit SHA ────────
      - name: Set version label
        id: version
        run: echo "label=app-${{ github.sha }}" >> $GITHUB_OUTPUT

      # ── Step 5: Configure AWS credentials (stored as GitHub Secrets) ───────
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.AWS_REGION }}

      # ── Step 6: Upload JAR to S3 ───────────────────────────────────────────
      - name: Upload JAR to S3
        run: |
          aws s3 cp target/spring-eb-app.jar \
            s3://${{ secrets.S3_BUCKET }}/${{ steps.version.outputs.label }}.jar

      # ── Step 7: Create a new Elastic Beanstalk application version ─────────
      - name: Create Elastic Beanstalk application version
        run: |
          aws elasticbeanstalk create-application-version \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --version-label ${{ steps.version.outputs.label }} \
            --source-bundle S3Bucket=${{ secrets.S3_BUCKET }},S3Key=${{ steps.version.outputs.label }}.jar \
            --description "Deployed from commit ${{ github.sha }} by ${{ github.actor }}"

      # ── Step 8: Deploy the new version to the EB environment ───────────────
      - name: Deploy to Elastic Beanstalk environment
        run: |
          aws elasticbeanstalk update-environment \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --environment-name ${{ secrets.EB_ENV_NAME }} \
            --version-label ${{ steps.version.outputs.label }}

      # ── Step 9: Wait for deployment to complete ────────────────────────────
      - name: Wait for environment to be ready
        run: |
          echo "Waiting for Elastic Beanstalk environment to become healthy..."
          aws elasticbeanstalk wait environment-updated \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --environment-names ${{ secrets.EB_ENV_NAME }}
          echo "Deployment complete!"

      # ── Step 10: Print the live app URL ───────────────────────────────────
      - name: Print application URL
        run: |
          URL=$(aws elasticbeanstalk describe-environments \
            --application-name ${{ secrets.EB_APP_NAME }} \
            --environment-names ${{ secrets.EB_ENV_NAME }} \
            --query "Environments[0].CNAME" \
            --output text)
          echo "✅ App is live at: http://$URL"
